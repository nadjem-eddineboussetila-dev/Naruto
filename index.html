<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>AR Anime Studio</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #container {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mirror {
        transform: scaleX(-1);
      }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      button.active {
        background: #1e88e5;
        border-color: #64b5f6;
      }
      #status {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <video id="inputVideo" autoplay playsinline></video>
      <canvas id="outputCanvas"></canvas>
      <div id="ui">
        <button id="rasenBtn" data-jutsu="rasenshuriken" class="active">Rasenshuriken</button>
        <button id="chidoriBtn" data-jutsu="chidori">Chidori</button>
        <button id="cameraBtn">Switch Camera</button>
      </div>
      <div id="status">Initializing hand tracking...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script>
      const video = document.getElementById("inputVideo");
      const canvas = document.getElementById("outputCanvas");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const rasenBtn = document.getElementById("rasenBtn");
      const chidoriBtn = document.getElementById("chidoriBtn");
      const cameraBtn = document.getElementById("cameraBtn");
      const RASEN_JUTSU = rasenBtn.dataset.jutsu;
      const CHIDORI_JUTSU = chidoriBtn.dataset.jutsu;
      const JUTSU_LABELS = {
        [RASEN_JUTSU]: rasenBtn.textContent.trim(),
        [CHIDORI_JUTSU]: chidoriBtn.textContent.trim(),
      };

      let canvasWidth = 0;
      let canvasHeight = 0;
      let latestResults = null;
      let camera = null;
      let useFrontCamera = true;
      let currentJutsu = RASEN_JUTSU;
      let smoothedPalm = null;
      let lastPalm = null;
      let lastFrameTime = 0;
      let handVisible = false;
      let burstPending = false;
      let sparkAccumulator = 0;
      let particles = [];
      const deviceMemory = navigator.deviceMemory || 0;
      const LOW_POWER_MODE =
        (deviceMemory && deviceMemory <= 4) ||
        (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
      const PARTICLE_QUALITY = LOW_POWER_MODE ? 0.7 : 1;
      const PARTICLE_GLOW_SCALE = LOW_POWER_MODE ? 0.6 : 1;
      const MAX_PARTICLES = Math.round(500 * PARTICLE_QUALITY);
      const HAND_MODEL_COMPLEXITY = 1;
      const TRAIL_SPEED_THRESHOLD = 520;
      const TRAIL_SPEED_PARTICLE_DIVISOR = 220;
      const TRAIL_PARTICLE_MIN = 1;
      const TRAIL_PARTICLE_MAX = Math.max(1, Math.round(5 * PARTICLE_QUALITY));
      const BURST_COUNT = Math.max(12, Math.round(28 * PARTICLE_QUALITY));
      const BURST_BASE_SPEED = 120;
      const BURST_SPEED_VARIANCE = 180;
      const SPARK_INTERVAL = 0.05;
      const SPARK_BASE_SPEED = 200;
      const SPARK_SPEED_VARIANCE = 220;
      const MAX_FRAME_TIME = 0.05;
      const PALM_SMOOTHING = 0.22;
      const MAX_HAND_SPEED = 2000;
      const MAX_SPARKS_PER_FRAME = Math.max(3, Math.round(6 * PARTICLE_QUALITY));
      const DEPTH_SCALE_FACTOR = 2.4;
      const DEPTH_SCALE_MIN = 0.65;
      const DEPTH_SCALE_MAX = 2.6;
      const PALM_OPEN_THRESHOLD = 0.02;

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: HAND_MODEL_COMPLEXITY,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });

      hands.onResults((results) => {
        latestResults = results;
      });

      function resizeCanvas() {
        if (!video.videoWidth || !video.videoHeight) {
          return;
        }
        const dpr = window.devicePixelRatio || 1;
        canvasWidth = video.videoWidth;
        canvasHeight = video.videoHeight;
        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      function setMirror(enabled) {
        video.classList.toggle("mirror", enabled);
        canvas.classList.toggle("mirror", enabled);
      }

      function startCamera() {
        if (camera) {
          camera.stop();
        }
        setMirror(useFrontCamera);
        camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          facingMode: useFrontCamera ? "user" : "environment",
        });
        camera.start();
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function distance3D(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = (a.z || 0) - (b.z || 0);
        return Math.hypot(dx, dy, dz);
      }

      function getPalmCenter(landmarks) {
        const ids = [0, 5, 9, 13, 17];
        const sum = ids.reduce(
          (acc, id) => {
            acc.x += landmarks[id].x;
            acc.y += landmarks[id].y;
            acc.z += landmarks[id].z || 0;
            return acc;
          },
          { x: 0, y: 0, z: 0 }
        );
        const count = ids.length;
        return {
          x: (sum.x / count) * canvasWidth,
          y: (sum.y / count) * canvasHeight,
          z: sum.z / count,
        };
      }

      function getDepthScale(landmarks) {
        const depth = landmarks[9].z || 0;
        return clamp(1 - depth * DEPTH_SCALE_FACTOR, DEPTH_SCALE_MIN, DEPTH_SCALE_MAX);
      }

      function isPalmOpen(landmarks) {
        const wrist = landmarks[0];
        const fingers = [
          [4, 3],
          [8, 6],
          [12, 10],
          [16, 14],
          [20, 18],
        ];
        return fingers.every(([tip, pip]) => {
          const tipDist = distance3D(landmarks[tip], wrist);
          const pipDist = distance3D(landmarks[pip], wrist);
          return tipDist > pipDist + PALM_OPEN_THRESHOLD;
        });
      }

      function addParticle(particle) {
        particles.push(particle);
      }

      function spawnBurst(x, y, scale) {
        for (let i = 0; i < BURST_COUNT; i += 1) {
          const angle = (Math.PI * 2 * i) / BURST_COUNT + Math.random() * 0.4;
          const speed = (BURST_BASE_SPEED + Math.random() * BURST_SPEED_VARIANCE) * scale;
          addParticle({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: (3 + Math.random() * 4) * scale,
            life: 0.6 + Math.random() * 0.4,
            age: 0,
            color: "rgba(120, 200, 255, 0.9)",
            glow: 14 * scale * PARTICLE_GLOW_SCALE,
            drag: 1.4,
          });
        }
      }

      function spawnTrail(x, y, scale, speed) {
        const amount = clamp(
          Math.floor(speed / TRAIL_SPEED_PARTICLE_DIVISOR),
          TRAIL_PARTICLE_MIN,
          TRAIL_PARTICLE_MAX
        );
        for (let i = 0; i < amount; i += 1) {
          addParticle({
            x: x + (Math.random() - 0.5) * 10 * scale,
            y: y + (Math.random() - 0.5) * 10 * scale,
            vx: (Math.random() - 0.5) * 40 * scale,
            vy: (Math.random() - 0.5) * 40 * scale,
            size: (2 + Math.random() * 3) * scale,
            life: 0.5 + Math.random() * 0.3,
            age: 0,
            color: "rgba(80, 180, 255, 0.7)",
            glow: 10 * scale * PARTICLE_GLOW_SCALE,
            drag: 1.8,
          });
        }
      }

      function spawnSpark(x, y, scale) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (SPARK_BASE_SPEED + Math.random() * SPARK_SPEED_VARIANCE) * scale;
        addParticle({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: (1.5 + Math.random() * 2) * scale,
          life: 0.25 + Math.random() * 0.2,
          age: 0,
          color: "rgba(220, 245, 255, 0.9)",
            glow: 18 * scale * PARTICLE_GLOW_SCALE,
          drag: 2.6,
        });
      }

      function updateParticles(dt) {
        let writeIndex = 0;
        const startIndex = Math.max(0, particles.length - MAX_PARTICLES);
        for (let i = startIndex; i < particles.length; i += 1) {
          const particle = particles[i];
          particle.age += dt;
          if (particle.age >= particle.life) {
            continue;
          }
          const dragFactor = Math.max(0, 1 - particle.drag * dt);
          particle.vx *= dragFactor;
          particle.vy *= dragFactor;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particles[writeIndex] = particle;
          writeIndex += 1;
        }
        particles.length = writeIndex;
      }

      function drawParticles() {
        for (const particle of particles) {
          const lifeRatio = 1 - particle.age / particle.life;
          ctx.save();
          ctx.globalAlpha = lifeRatio;
          ctx.fillStyle = particle.color;
          ctx.shadowColor = particle.color;
          ctx.shadowBlur = particle.glow;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawRasenshuriken(ctx, x, y, radius, time) {
        ctx.save();
        ctx.translate(x, y);
        const rotation = time * 0.002;
        for (let i = 0; i < 3; i += 1) {
          ctx.save();
          ctx.rotate(rotation * (i % 2 === 0 ? 1 : -1) * 1.2);
          const layerRadius = radius * (1 - i * 0.12);
          const gradient = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, layerRadius);
          gradient.addColorStop(0, "rgba(160, 245, 255, 0.65)");
          gradient.addColorStop(0.45, "rgba(80, 200, 255, 0.4)");
          gradient.addColorStop(1, "rgba(0, 80, 160, 0.05)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, layerRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        const blades = 9;
        for (let i = 0; i < blades; i += 1) {
          const angle = (Math.PI * 2 * i) / blades + rotation * 2;
          const jitter = Math.sin(time * 0.012 + i) * 0.12;
          ctx.save();
          ctx.rotate(angle + jitter);
          ctx.beginPath();
          ctx.moveTo(radius * 0.1, 0);
          ctx.quadraticCurveTo(radius * 0.65, radius * 0.2, radius * 1.15, 0);
          ctx.quadraticCurveTo(radius * 0.65, -radius * 0.2, radius * 0.1, 0);
          ctx.fillStyle = "rgba(190, 250, 255, 0.35)";
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawLightningBolt(ctx, length, segments, angle) {
        const step = length / segments;
        let offset = 0;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let i = 1; i <= segments; i += 1) {
          offset += (Math.random() - 0.5) * step * 0.8;
          ctx.lineTo(step * i, offset);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawChidori(ctx, x, y, radius, time) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = "rgba(150, 230, 255, 0.9)";
        ctx.lineWidth = radius * 0.08;
        ctx.shadowColor = "rgba(120, 220, 255, 0.9)";
        ctx.shadowBlur = radius * 0.6;
        const bolts = 6;
        for (let i = 0; i < bolts; i += 1) {
          const angle = (Math.PI * 2 * i) / bolts + time * 0.003;
          drawLightningBolt(ctx, radius * 1.4, 6, angle);
        }
        ctx.restore();
      }

      function drawSharingan(ctx, x, y, radius, time) {
        const rotationTime = time * 0.001;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotationTime * 0.6);
        ctx.fillStyle = "#c61212";
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1b1b1b";
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();

        const tomoeRadius = radius * 0.16;
        for (let i = 0; i < 3; i += 1) {
          ctx.save();
          ctx.rotate((Math.PI * 2 * i) / 3);
          ctx.translate(0, -radius * 0.55);
          ctx.beginPath();
          ctx.moveTo(0, -tomoeRadius);
          ctx.quadraticCurveTo(tomoeRadius, 0, 0, tomoeRadius);
          ctx.quadraticCurveTo(-tomoeRadius, 0, 0, -tomoeRadius);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(tomoeRadius * 0.35, -tomoeRadius * 0.6, tomoeRadius * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function render(time) {
        if (!lastFrameTime) {
          lastFrameTime = time;
        }
        const dt = Math.min((time - lastFrameTime) / 1000, MAX_FRAME_TIME);
        lastFrameTime = time;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        let hasHand = false;
        if (latestResults?.multiHandLandmarks?.length) {
          const landmarks = latestResults.multiHandLandmarks[0];
          if (canvasWidth && canvasHeight) {
            const palm = getPalmCenter(landmarks);
            const depthScale = getDepthScale(landmarks);
            const baseRadius = Math.min(canvasWidth, canvasHeight) * 0.08 * depthScale;
            if (!smoothedPalm) {
              smoothedPalm = { ...palm };
            } else {
              smoothedPalm.x = lerp(smoothedPalm.x, palm.x, PALM_SMOOTHING);
              smoothedPalm.y = lerp(smoothedPalm.y, palm.y, PALM_SMOOTHING);
              smoothedPalm.z = lerp(smoothedPalm.z, palm.z, PALM_SMOOTHING);
            }

            if (!handVisible) {
              spawnBurst(smoothedPalm.x, smoothedPalm.y, depthScale);
            } else if (burstPending) {
              spawnBurst(smoothedPalm.x, smoothedPalm.y, depthScale);
              burstPending = false;
            }

            if (lastPalm) {
              const dx = smoothedPalm.x - lastPalm.x;
              const dy = smoothedPalm.y - lastPalm.y;
              const speed = dt > 0 ? Math.hypot(dx, dy) / dt : 0;
              const cappedSpeed = Math.min(speed, MAX_HAND_SPEED);
              if (cappedSpeed > TRAIL_SPEED_THRESHOLD) {
                spawnTrail(smoothedPalm.x, smoothedPalm.y, depthScale, cappedSpeed);
              }
            }

            lastPalm = { x: smoothedPalm.x, y: smoothedPalm.y };
            hasHand = true;
            handVisible = true;
            statusEl.textContent = `Jutsu: ${JUTSU_LABELS[currentJutsu]} | Hand Detected`;

            if (currentJutsu === RASEN_JUTSU) {
              drawRasenshuriken(ctx, smoothedPalm.x, smoothedPalm.y, baseRadius * 1.1, time);
            } else if (currentJutsu === CHIDORI_JUTSU) {
              drawChidori(ctx, smoothedPalm.x, smoothedPalm.y, baseRadius, time);
              sparkAccumulator += dt;
              const sparksToSpawn = Math.min(
                Math.floor(sparkAccumulator / SPARK_INTERVAL),
                MAX_SPARKS_PER_FRAME
              );
              for (let i = 0; i < sparksToSpawn; i += 1) {
                spawnSpark(
                  smoothedPalm.x + (Math.random() - 0.5) * baseRadius * 0.6,
                  smoothedPalm.y + (Math.random() - 0.5) * baseRadius * 0.6,
                  depthScale
                );
              }
              sparkAccumulator -= sparksToSpawn * SPARK_INTERVAL;
            }

            if (isPalmOpen(landmarks)) {
              drawSharingan(ctx, smoothedPalm.x, smoothedPalm.y, baseRadius * 0.65, time);
            }
          }
        }

        if (!hasHand) {
          if (handVisible) {
            handVisible = false;
            smoothedPalm = null;
            lastPalm = null;
            statusEl.textContent = "No hand detected";
          }
        }

        updateParticles(dt);
        drawParticles();

        requestAnimationFrame(render);
      }

      function setJutsu(jutsu) {
        currentJutsu = jutsu;
        rasenBtn.classList.toggle("active", jutsu === RASEN_JUTSU);
        chidoriBtn.classList.toggle("active", jutsu === CHIDORI_JUTSU);
        burstPending = true;
      }

      document.querySelectorAll("[data-jutsu]").forEach((button) => {
        button.addEventListener("click", (event) => setJutsu(event.currentTarget.dataset.jutsu));
      });
      cameraBtn.addEventListener("click", () => {
        useFrontCamera = !useFrontCamera;
        startCamera();
      });

      video.addEventListener("loadedmetadata", () => {
        resizeCanvas();
      });
      if (video.videoWidth && video.videoHeight) {
        resizeCanvas();
      }
      window.addEventListener("resize", resizeCanvas);

      startCamera();
      requestAnimationFrame(render);
    </script>
  </body>
</html>
